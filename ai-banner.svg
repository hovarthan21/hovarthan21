<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dc62a"/>
      <stop offset="50%" stop-color="#00e0d3"/>
      <stop offset="100%" stop-color="#2dc62a">
        <animate attributeName="offset" values="0.9;0.1;0.9" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- Neural network layer 1 -->
  <g stroke="#2dc62a" stroke-width="1" opacity="0.35">
    <line x1="80" y1="60" x2="220" y2="40"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="80" y1="60" x2="220" y2="90"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.1s" repeatCount="indefinite"/></line>
    <line x1="80" y1="130" x2="220" y2="90"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="80" y1="130" x2="220" y2="150"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" repeatCount="indefinite"/></line>
    <line x1="80" y1="200" x2="220" y2="150"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="80" y1="200" x2="220" y2="200"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/></line>

    <line x1="220" y1="40" x2="360" y2="80"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.3s" repeatCount="indefinite"/></line>
    <line x1="220" y1="90" x2="360" y2="80"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="220" y1="90" x2="360" y2="130"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.8s" repeatCount="indefinite"/></line>
    <line x1="220" y1="150" x2="360" y2="130"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="220" y1="150" x2="360" y2="180"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/></line>
    <line x1="220" y1="200" x2="360" y2="180"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- Nodes -->
  <g fill="#2dc62a" filter="url(#glow)">
    <circle cx="80" cy="60" r="5"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="130" r="5"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="200" r="5"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>

    <circle cx="220" cy="40" r="4" fill="#00e0d3"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="90" r="4" fill="#00e0d3"><animate attributeName="r" values="3;6;3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="150" r="4" fill="#00e0d3"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="200" r="4" fill="#00e0d3"><animate attributeName="r" values="3;6;3" dur="2.1s" repeatCount="indefinite"/></circle>

    <circle cx="360" cy="80" r="5"><animate attributeName="r" values="4;7;4" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="130" r="5"><animate attributeName="r" values="4;7;4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="180" r="5"><animate attributeName="r" values="4;7;4" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moving data pulse dots along the network -->
  <g fill="#ffffff">
    <circle r="2.5">
      <animateMotion dur="3s" repeatCount="indefinite" path="M80,60 L220,90 L360,130"/>
    </circle>
    <circle r="2.5">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M80,200 L220,150 L360,180"/>
    </circle>
    <circle r="2.5">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M80,130 L220,90 L360,80"/>
    </circle>
  </g>

  <!-- Title text -->
  <text x="440" y="115" font-family="Segoe UI, Verdana, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)">
    HOVARTHAN S
  </text>
  <text x="440" y="150" font-family="Consolas, monospace" font-size="18" fill="#8b949e">
    AI &amp; Data Science Engineer
    <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="180" font-family="Consolas, monospace" font-size="14" fill="#2dc62a">
    &gt; training_models() &amp;&amp; deploying_to_cloud() &amp;&amp; automating_pipelines()
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- Orbit ring decoration -->
  <g transform="translate(650,180)" opacity="0.5">
    <circle r="55" fill="none" stroke="#2dc62a" stroke-width="1" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="35" fill="none" stroke="#00e0d3" stroke-width="1" stroke-dasharray="3 5">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="0" r="3" fill="#2dc62a">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
